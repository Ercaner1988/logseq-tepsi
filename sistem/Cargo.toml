[package]
name = "logseq-tepsi-sistem"
version = "0.1.0"
edition = "2021"
publish = false
description = "logseq-tepsi'nin Windows kurulum katmanı: kayıt defteri, başlangıç kısayolu (COM), kur/kaldir alt komutları."

[dependencies]
logseq-tepsi-cekirdek = { path = "../cekirdek" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
] }
